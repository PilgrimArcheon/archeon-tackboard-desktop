name: TackBoard Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'tackboard-desktop-v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }} preview installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            task: dist:win
          - name: macos-universal-architectures
            runner: macos-latest
            task: dist:mac
    steps:
      - name: Checkout desktop source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release source and version
        shell: bash
        run: node scripts/release-preflight.cjs
      - name: Install reproducible dependencies
        shell: bash
        run: npm ci --no-audit --no-fund
      - name: Run desktop tests
        shell: bash
        run: npm test
      - name: Build unsigned preview installers
        shell: bash
        run: npm run ${{ matrix.task }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Signing + Apple notarization must be configured before customer release.
      - name: Verify expected native installers
        shell: bash
        run: node scripts/verify-native-output.cjs ${{ matrix.name }}
      - name: Upload review-only installers
        uses: actions/upload-artifact@v4
        with:
          name: tackboard-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish tagged prerelease with SHA256 checksums
    if: startsWith(github.ref, 'refs/tags/tackboard-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tackboard-*
          path: release-assets
          merge-multiple: true
      - name: Validate builds and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          windows=( *.exe )
          mac_dmg=( *.dmg )
          mac_zip=( *.zip )
          if (( ${#windows[@]} != 1 || ${#mac_dmg[@]} != 2 || ${#mac_zip[@]} != 2 )); then
            echo "Expected exactly one Windows installer, two macOS DMGs and two macOS ZIPs." >&2
            ls -lh
            exit 1
          fi
          sha256sum -- *.exe *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create unsigned preview GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( release-assets/*.exe release-assets/*.dmg release-assets/*.zip release-assets/SHA256SUMS.txt )
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TackBoard Desktop ${GITHUB_REF_NAME}" \
            --notes-file RELEASE-PREVIEW-NOTES.md \
            --prerelease

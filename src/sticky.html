<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TackBoard note</title><link rel="stylesheet" href="sticky.css"></head>
<body><div class="paper" id="paper"><header class="grip"><span class="dots" aria-label="Drag note">⠿</span><span id="flag">PLANNED</span><div class="controls"><button id="edit" title="Edit note" aria-label="Edit note">✎</button><button id="expand" title="Expand note" aria-label="Expand note">⤢</button><button id="hub" title="Open TackBoard settings" aria-label="Open settings">⋯</button></div></header>
<h1 id="title"></h1><p id="body" class="description"></p><div id="tasks" class="tasks"></div>
<form id="newTask"><input id="taskInput" placeholder="+ Add checklist item" maxlength="180" aria-label="New checklist item"></form>
<footer><span id="progress">0 / 0 done</span><button id="archive" title="Peel off finished note" aria-label="Complete and archive">↗</button></footer><div id="bar" class="bar"></div></div>
<script src="sticky.js"></script></body></html>
